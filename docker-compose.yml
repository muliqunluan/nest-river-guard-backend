services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: river-guard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-12100}
      POSTGRES_DB: ${DB_NAME:-river_guard}
    # 不发布宿主机端口：后端通过内部网络 postgres:5432 连接，
    # 避免宿主机 5432 被占用时导致容器网络配置失败（隔离）而连不上数据库。
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - river-guard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: river-guard-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${PG_USERNAME:-postgres}
      DB_PASSWORD: ${PG_PASSWORD:-12100}
      DB_NAME: ${DB_NAME:-river_guard}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      KEY: ${KEY}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      MAX_IMAGE_SIZE: ${MAX_IMAGE_SIZE:-5242880}
      MAX_VIDEO_SIZE: ${MAX_VIDEO_SIZE:-52428800}
    ports:
      - "7050:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - river-guard-network
    # 应用启动前先校验数据库连接与初始化数据，任何一步失败容器都会退出，
    # 配合 restart: unless-stopped 与下方 healthcheck 可正确反映部署是否就绪。
    command: >
      sh -c "
        echo '检查数据库连接...' &&
        node dist/scripts/check-db.js &&
        echo '初始化测试数据...' &&
        node dist/scripts/init-test-data.js &&
        echo '启动应用...' &&
        node dist/main
      "
    healthcheck:
      # 通过 Swagger JSON 端点确认应用已真正监听并响应，而非仅容器处于 running 状态
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api-docs-json > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  uploads_data:

networks:
  river-guard-network:
    driver: bridge
